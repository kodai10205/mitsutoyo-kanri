<style>
:root{--bg:#eef2f4;--sf:#fff;--ink:#14242e;--mut:#5b6b75;--ln:#d3dce1;--ac:#0e7c9a;--bad:#c8372d;--badbg:#fbe9e7;--off:#e3e8eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191f;--sf:#192630;--ink:#e6eef2;--mut:#93a5af;--ln:#2c3c47;--ac:#4cb8d6;--bad:#ff8a7e;--badbg:#3a1f1c;--off:#25343e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10191f;--sf:#192630;--ink:#e6eef2;--mut:#93a5af;--ln:#2c3c47;--ac:#4cb8d6;--bad:#ff8a7e;--badbg:#3a1f1c;--off:#25343e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif}
header{padding:14px 14px 0}
h1{font-size:18px;margin:0}
#st{font-size:12px;color:var(--mut);margin:2px 0 10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--ln)}
.tabs button{flex:1;padding:10px 0;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
main{padding:12px 14px 40px;max-width:760px;margin:0 auto}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav b{font-size:16px}
.btn{padding:8px 14px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.ic{padding:8px 10px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.hb{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.btn.sm{padding:6px 10px;font-size:13px}.chip.pd,.z.pd{background:hsl(150 45% 32%);color:#fff}.chip.c2{font-size:10px;padding:2px;margin-bottom:2px;white-space:nowrap;text-overflow:ellipsis}button.z.z2{height:14px;line-height:14px;font-size:9px;margin-bottom:1px}.fold{margin-bottom:6px}.fh{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 12px;margin:6px 0;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}.fh small{color:var(--mut);font-weight:400}
.ex .er,.ex .eh{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;margin-bottom:6px}.ex .eh{font-size:12px;color:var(--mut);margin-bottom:4px}.ex .en{font-size:14px}.ex .ea{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}.ex .et{text-align:right;margin-top:6px}
button.z{border:0;width:100%;font-family:inherit;cursor:pointer;padding:0}.z.rp{box-shadow:inset 0 -3px 0 rgba(255,255,255,.85)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}.toast.on{opacity:1}
@page{size:182mm 257mm;margin:8mm}
.pfp{position:fixed;left:-10000px;top:0}
.pf{width:190mm;background:#fff;color:#000;font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;font-size:3.5mm;line-height:1.3;text-align:left;page-break-inside:avoid}
.pf *{box-sizing:border-box}
.pf table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:0}
.pf .pb{border-top:var(--bw,1px) solid #000;border-left:var(--bw,1px) solid #000}
.pf td{border:0;border-right:var(--bw,1px) solid #000;border-bottom:var(--bw,1px) solid #000;padding:0 1.2mm;text-align:left;vertical-align:middle;overflow:hidden;word-break:break-all;background:#fff}
.pf td.lb{text-align:center;letter-spacing:0;white-space:nowrap;padding:0}
.pf td.c{text-align:center}
.pf td.np{padding:0}
.pf td.r{text-align:right}
.pf td.v{font-size:3.6mm}
.pf td.vs{letter-spacing:0}
.pf td.vs span{display:block;line-height:1.55}
.pf .pt{position:relative;height:9mm}
.pf .ti{position:absolute;left:0;right:0;bottom:1.2mm;text-align:center;font-size:5.2mm;font-weight:600;letter-spacing:.12em;padding-left:.12em}
.pf .co{position:absolute;right:0;bottom:1.2mm;font-size:5.2mm;font-weight:600}
.pf .v2{display:flex;justify-content:space-between;align-items:center;height:12.6mm}
.pf .v2 .sm{margin-left:2.5mm}
.pf .sm{font-size:3.2mm}
.pf .rd{color:#d40000}
.pf .sm2{font-size:3.3mm;line-height:1.3}
.pf .rb{position:relative}
.pf .rl{position:absolute;left:0;right:0;height:0;border-top:var(--bw,1px) solid #000;display:block}
.pf .rt{position:relative;white-space:pre-wrap;overflow:hidden;padding:0 1.5mm;word-break:break-all;font-size:3.6mm}
.pf .rm{white-space:pre-wrap;padding:1mm 1.5mm;height:43.4mm;overflow:hidden;font-size:3.4mm;line-height:1.35;word-break:break-all}
@media print{
 html,body{margin:0!important;padding:0!important;background:#fff!important}
 header,main,.sheet,.toast{display:none!important}
 .pfp{position:static;left:auto}
 .pfp .pf{zoom:.87}
}
.seg button{flex:1;padding:9px 0;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;font:inherit;font-weight:600;cursor:pointer}.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}.btn:disabled{opacity:.35;cursor:default}
.wrap{overflow-x:auto;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{padding:0;border-bottom:1px solid var(--ln);border-right:1px solid var(--ln);text-align:center}
th{font-size:12px;font-weight:600;padding:6px 2px;color:var(--mut);background:var(--sf)}
th.today{color:var(--ac)}
.nm{position:sticky;left:0;background:var(--sf);text-align:left;padding:6px 8px;min-width:92px;z-index:1;font-weight:600}
.nm small{display:block;color:var(--mut);font-weight:400;font-size:11px}
td.c{min-width:58px;height:50px}
td.c button{width:100%;height:100%;border:0;background:none;padding:3px;cursor:pointer;font:inherit}
.chip{display:block;border-radius:6px;color:#fff;font-size:12px;line-height:1.2;padding:6px 2px;overflow:hidden;word-break:break-all}
.chip.off{background:var(--off);color:var(--mut)}
.empty{color:var(--ln);font-size:20px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.warn{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row small{color:var(--mut)}
h2{font-size:14px;margin:18px 0 8px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f label{font-size:12px;color:var(--mut);display:block}
.f input,.f select,.f textarea{font:inherit;resize:vertical;width:100%;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.f .w{grid-column:1/-1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet>div{background:var(--sf);width:100%;max-width:760px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto}
.sheet .opt{display:block;width:100%;text-align:left;margin-bottom:8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.mg>*{background:var(--sf);min-width:0}
.mg .h{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.mg button.mc{border:0;min-height:68px;padding:3px;text-align:left;font:inherit;font-size:11px;line-height:1.3;color:var(--ink);cursor:pointer}
.mg button.mc.today{box-shadow:inset 0 0 0 2px var(--ac)}
.mc .d{font-weight:600;font-size:12px;display:block}
.mc .l{display:block;white-space:nowrap;overflow:hidden}
.mc .l.bad{color:var(--bad);font-weight:600}
.mc .blank{min-height:68px}
.mg button.mc.dp{min-height:44px;text-align:center;background:var(--bg)}
.kt{width:100%}.kt td,.kt th{padding:6px 4px;font-size:13px}.kt td.ym{text-align:left;padding-left:8px;white-space:nowrap}.kt .tt td{font-weight:600}.kt td.short{color:var(--bad)}
td.dz{min-width:32px;padding:2px}
.mg.mw{grid-template-columns:repeat(7,minmax(90px,1fr));min-width:630px;border:0}.ms{display:block;border-left:3px solid;padding-left:3px;margin-top:2px;font-size:11px;line-height:1.3;white-space:normal;word-break:break-all}.z{display:block;border-radius:4px;color:#fff;font-size:11px;line-height:28px;height:28px}.z.off{background:var(--off);color:var(--mut)}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="sync.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>
<body>
<header><h1>MITSUTOYO管理</h1><div id="st">読み込み中…</div>
<div class="tabs"><button data-t="g">週</button><button data-t="m">月</button><button data-t="k">人工</button><button data-t="d">出面</button><button data-t="r">日報</button><button data-t="s">現場</button><button data-t="p">作業員</button></div></header>
<main id="m"></main>
<div id="tt" class="toast" role="status"></div>
<div id="pfp" class="pfp"></div>
<div class="sheet" id="sh"><div id="shc"></div></div>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const prs=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>add(d,-((d.getDay()+6)%7));
const DW=['日','月','火','水','木','金','土'];
const md=d=>(d.getMonth()+1)+'/'+d.getDate();
const uid=()=>'x'+Math.random().toString(36).slice(2,9);
const HOL=new Set(['2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23','2027-01-01','2027-01-11','2027-02-11','2027-02-23','2027-03-21','2027-03-22','2027-04-29','2027-05-03','2027-05-04','2027-05-05','2027-07-19','2027-08-11','2027-09-20','2027-09-23','2027-10-11','2027-11-03','2027-11-23']);
const defWork=f=>prs(f).getDay()!=0&&!HOL.has(f);
function roleAt(pid,sid){const s=M.sites[sid];if(s&&s.f==pid)return '職長';const p=M.staff[pid];return p&&p.r=='応援'?'応援':'施工者'}
function isWork(s,f){if(f<s.s||f>s.e)return false;if((s.o||[]).includes(f))return false;if((s.x||[]).includes(f))return true;return defWork(f)}
let tab='g',ws=mon(new Date()),mo=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const M={staff:{},sites:{},a:{},r:{}};
let db=null,shared=false;
const $m=document.getElementById('m'),$sh=document.getElementById('sh'),$st=document.getElementById('st');

/* data layer: shared db when available, otherwise this device only */
const K={staff:'staff',sites:'sites',a:'asg',r:'reports'};
function persist(){try{localStorage.setItem('haichi2',JSON.stringify(M))}catch(e){}}
function werr(){toast('保存できませんでした。編集できる権限があるか、共有設定を確認してください。');return false}
function put(key,id,data){
  if(db){return db.doc(K[key]+'/'+id).set(data).catch(werr)}
  M[key][id]=data;persist();draw();return Promise.resolve()}
function rem(key,id){
  if(db){return db.doc(K[key]+'/'+id).delete().catch(werr)}
  delete M[key][id];persist();draw();return Promise.resolve()}
function sub(key){
  db.collection(K[key]).onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});M[key]=o;
    if(!s.fromCache)clearTimeout(tm);$st.textContent='共有中：変更は、このアプリを使っている全員に反映されます';draw()},
    ()=>{$st.textContent='データを読み込めませんでした'})}
let tm;
(async()=>{
  try{db=window.claude&&claude.use?await claude.use('db'):null}catch(e){db=null}
  if(db){shared=true;tm=setTimeout(()=>{$st.textContent='サーバーに接続できません。表示が古い可能性があります'},10000);sub('staff');sub('sites');sub('a');sub('r')}
  else{try{const x=JSON.parse(localStorage.getItem('haichi2'));if(x){M.staff=x.staff||{};M.sites=x.sites||{};M.a=x.a||{};M.r=x.r||{}}}catch(e){}
    $st.textContent='共有設定が未完了、または接続できません：この端末だけに保存しています'}
  draw()})();

/* helpers */
const staffL=()=>Object.entries(M.staff).sort((a,b)=>((a[1].ord==null)-(b[1].ord==null))||((a[1].ord??a[1].t??0)-(b[1].ord??b[1].t??0)));
const siteL=()=>Object.entries(M.sites).sort((a,b)=>a[1].s<b[1].s?-1:a[1].s>b[1].s?1:(a[1].t||0)-(b[1].t||0));
const col=s=>`hsl(${s.h} 55% 36%)`;
function index(){const ix={};for(const k in M.a){const x=M.a[k];const p=M.staff[x.p];if(!p)continue;(ix[x.d]=ix[x.d]||[]).push({p:x.p,n:p.n,v:x.v});if(x.v2)ix[x.d].push({p:x.p,n:p.n,v:x.v2})}return ix}
function active(f){return siteL().filter(([id,s])=>!s.done&&isWork(s,f))}
const cnt=(ix,f,sid)=>(ix[f]||[]).filter(x=>x.v==sid).length;

function grid(){
  const ix=index(),days=[...Array(7)].map((_,i)=>add(ws,i)),t=fmt(new Date()),sl=staffL();
  let h=`<div class="nav"><button class="btn" onclick="wk(-7)">前の週</button><b>${md(days[0])} 〜 ${md(days[6])}</b><button class="btn" onclick="wk(7)">次の週</button></div>`;
  if(!sl.length)return h+'<div class="card">作業員がまだいません。「作業員」タブから追加してください。</div>';
  h+=`<div class="wrap"><table><tr><th class="nm"> </th>${days.map(d=>`<th class="${fmt(d)==t?'today':''}">${DW[d.getDay()]}<br>${md(d)}</th>`).join('')}</tr>`;
  sl.forEach(([pid,p])=>{h+=`<tr><td class="nm">${esc(p.n)}<small>${p.r=='応援'?'応援':'施工者'}</small><small>有給 ${paidCount(pid,String(ws.getFullYear()))}回</small></td>`;
    days.forEach(d=>{const f=fmt(d),x=M.a[pid+'_'+f],s=x&&x.v!='off'?M.sites[x.v]:null;
      h+=`<td class="c"><button onclick="pick('${pid}','${f}')" aria-label="${esc(p.n)} ${md(d)}">${x&&x.v=='off'?'<span class="chip off">休み</span>':x&&x.v=='paid'?'<span class="chip pd">有給</span>':chips(x,pid)}</button></td>`});
    h+='</tr>'});
  h+='</table></div><p style="font-size:12px;color:var(--mut);margin:6px 0 0">★は、その現場の職長です。名前の下の「有給」は、表示中の年の有給の回数です。</p>';
  return h}

function month(){
  const ix=index(),y=mo.getFullYear(),m=mo.getMonth(),t=fmt(new Date());
  const last=new Date(y,m+1,0).getDate(),lead=(mo.getDay()+6)%7,used=new Set();
  let h=`<div class="nav"><button class="btn" onclick="mv(-1)">前の月</button><b>${y}年${m+1}月</b><button class="btn" onclick="mv(1)">次の月</button></div><div class="wrap"><div class="mg mw">`;
  ['月','火','水','木','金','土','日'].forEach(x=>h+=`<div class="h">${x}</div>`);
  for(let i=0;i<lead;i++)h+='<div class="mc"><div class="blank"></div></div>';
  for(let d=1;d<=last;d++){const f=fmt(new Date(y,m,d)),by={};
    (ix[f]||[]).forEach(x=>{if(x.v!='off'&&M.sites[x.v])(by[x.v]=by[x.v]||[]).push(x)});
    const lines=siteL().map(([id])=>id).filter(id=>by[id]).map(sid=>{used.add(sid);
      return `<span class="ms" style="border-color:${col(M.sites[sid])}">${by[sid].map(x=>(roleAt(x.p,sid)=='職長'?'★':'')+esc(x.n)).join('・')}</span>`}).join('');
    h+=`<button class="mc${f==t?' today':''}" onclick="dayInfo('${f}')"><span class="d">${d}</span>${lines}</button>`}
  h+='</div></div>';
  h+='<div style="margin-top:8px">'+siteL().filter(([id])=>used.has(id)).map(([id,s])=>`<span style="margin-right:10px;font-size:13px"><span class="sw" style="background:${col(s)}"></span>${esc(s.n)}</span>`).join('')+'</div>';
  h+='<p style="font-size:12px;color:var(--mut)">色の線は現場、名前はその日の配置です（★は職長）。日をタップすると内訳が見られます。表は左右にスクロールできます。</p>';
  return h}

let siteTab='act',SQ='',SS='new',YO={};
function siteCard([id,s],isDone){let n=0;for(let x=prs(s.s),e=prs(s.e);x<=e;x=add(x,1))if(isWork(s,fmt(x)))n++;
  const btns=isDone?`<button class="btn sm" onclick="setDone('${id}',false)">稼働に戻す</button><button class="btn sm" onclick="delSite('${id}')">削除</button>`:`<button class="btn sm" onclick="editSite('${id}')">編集</button><button class="btn sm" onclick="setDone('${id}',true)">完了</button><button class="btn sm" onclick="delSite('${id}')">削除</button>`;
  return `<div class="card"><div class="row"><div><span class="sw" style="background:${col(s)}"></span><b>${esc(s.n)}</b>${s.c?`<br><small>元請け：${esc(s.c)}</small>`:''}<br><small>乗り込み ${s.s.slice(5).replace('-','/')}　竣工予定 ${s.e.slice(5).replace('-','/')}　稼働${n}日${M.staff[s.f]?`　職長：${esc(M.staff[s.f].n)}`:''}</small></div><div style="display:flex;gap:6px;flex-shrink:0">${btns}</div></div>${s.memo?`<div style="margin-top:6px;font-size:13px;white-space:pre-wrap">${esc(s.memo)}</div>`:''}</div>`}
function siteList(){
  const q=SQ.trim().toLowerCase(),done=siteTab=='done';
  let a=Object.entries(M.sites).filter(([,s])=>!!s.done==done);
  const total=a.length;
  if(q)a=a.filter(([,s])=>[s.n,s.c,s.memo,M.staff[s.f]&&M.staff[s.f].n].join(' ').toLowerCase().includes(q));
  const ja=(x,y)=>(x||'').localeCompare(y||'','ja');
  const cmp={new:(x,y)=>x[1].s<y[1].s?1:x[1].s>y[1].s?-1:0,old:(x,y)=>x[1].s<y[1].s?-1:x[1].s>y[1].s?1:0,name:(x,y)=>ja(x[1].n,y[1].n),client:(x,y)=>ja(x[1].c,y[1].c)||ja(x[1].n,y[1].n)};
  a.sort(cmp[SS]||cmp.new);

function fillPrint(){document.getElementById('pfp').innerHTML=pfHTML()}
function prevPage(){
  fillPrint();
  const w=Math.max(280,Math.min(window.innerWidth,760)-28),k=w/718.1,hh=(274*3.7795*k).toFixed(1),dpr=window.devicePixelRatio||1,ld=Math.max(1,Math.round(dpr)),zs=!!(window.CSS&&CSS.supports&&CSS.supports('zoom','1')),bw=(ld/(dpr*k)).toFixed(4)+'px';
  return `<div class="nav"><button class="btn" onclick="RP.pv=false;draw()">戻る</button><b>B5の書式（プレビュー）</b></div>
<div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn" style="flex:1" onclick="doPrint()">印刷</button><button class="btn pri" style="flex:1" onclick="pdfSave()">PDFで保存</button></div>
<p style="font-size:12px;color:var(--mut);margin:0 0 10px">用紙はB5の縦、倍率は「100％（実際のサイズ）」で印刷してください。上下左右に8mmの余白を取っています。「印刷」で印刷画面が開かない場合は、自動でPDFを保存します。保存したPDFを開いて、B5・倍率100％で印刷してください。</p>
<div style="width:${w}px;${zs?'':`height:${hh}px;overflow:hidden;`}background:#fff;box-shadow:0 0 0 1px var(--ln);--bw:${bw}"><div style="width:190mm;${zs?`zoom:${k}`:`transform:scale(${k});transform-origin:0 0`}">${pfHTML()}</div></div>`}
function doPrint(){fillPrint();let ok=false;const h=()=>{ok=true};window.addEventListener('beforeprint',h,{once:true});
  try{window.print()}catch(e){}
  setTimeout(()=>{window.removeEventListener('beforeprint',h);if(!ok){toast('この画面では印刷画面を開けません。PDFを保存しますので、保存したPDFを開いて印刷してください');pdfSave()}},700)}
async function pdfSave(){
  fillPrint();
  let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
  if(!dl){toast('この画面ではPDF保存を使えません。印刷をお試しください');return}
  if(!window.html2canvas||!window.jspdf){toast('PDF作成の部品を読み込めませんでした');return}
  toast('PDFを作成しています…');
  try{
    const cv=await html2canvas(document.querySelector('#pfp .pf'),{scale:3,backgroundColor:'#ffffff',onclone:doc=>{const e=doc.getElementById('pfp');e.style.position='static';e.style.left='0'}});
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:[182,257],orientation:'portrait'}),w=Math.min(166,241*cv.width/cv.height),h=w*cv.height/cv.width;
    pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',(182-w)/2,8,w,h);
    const nm=((M.sites[RP.sid]||{}).n||'').replace(/[\\\/:*?"<>|]/g,'');
    await dl.save({filename:`工事日報_${nm}_${RP.d}.pdf`,data:pdf.output('blob')})
  }catch(e){if(!e||e.code!='declined')toast('PDFを保存できませんでした')}}

let SR=null;
function editStaff(id){const p=M.staff[id];SR={id,n:p.n,r:p.r=='応援'?'応援':'施工'};sheetStaff();$sh.classList.add('on')}
function sheetStaff(){
  document.getElementById('shc').innerHTML=`<b>作業員を編集</b><div class="f" style="margin:10px 0"><div class="w"><label>名前</label><input value="${esc(SR.n)}" oninput="SR.n=this.value"></div><div class="w"><label>役割</label><select onchange="SR.r=this.value"><option value="施工"${SR.r=='施工'?' selected':''}>施工者</option><option value="応援"${SR.r=='応援'?' selected':''}>応援</option></select></div></div><div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="$sh.classList.remove('on')">キャンセル</button><button class="btn pri" style="flex:1" onclick="saveStaff()">保存</button></div>`}
function saveStaff(){if(!SR.n.trim()){toast('名前を入力してください');return}$sh.classList.remove('on');put('staff',SR.id,{...M.staff[SR.id],n:SR.n.trim(),r:SR.r})}

function kosu(){
  const R={};
  for(const k in M.a){const x=M.a[k];if(!M.staff[x.p])continue;const ids=[x.v,x.v2].filter(i=>i&&M.sites[i]);if(!ids.length)continue;const wt=1/ids.length;
    ids.forEach(sid=>{const ym=x.d.slice(0,7),r=roleAt(x.p,sid),c=r=='職長'?'f':r=='応援'?'o':'s';R[sid]=R[sid]||{};R[sid][ym]=R[sid][ym]||{f:0,s:0,o:0};R[sid][ym][c]+=wt})}
  let h='<h2>現場別・月別の人工</h2><p style="font-size:12px;color:var(--mut);margin:0 0 8px">1日の配置を1人工として数えます（1日に2現場の場合は、それぞれ0.5人工）。</p>';
  if(!siteL().length)return h+'<div class="card">現場がまだありません。</div>';
  siteL().forEach(([sid,s])=>{
    const yms=Object.keys(R[sid]||{}).sort(),T={f:0,s:0,o:0};
    const rows=yms.map(ym=>{const r=R[sid][ym],tot=r.f+r.s+r.o;T.f+=r.f;T.s+=r.s;T.o+=r.o;
      return `<tr><td class="ym">${ym.replace('-','年')}月</td><td>${r.f}</td><td>${r.s}</td><td>${r.o}</td><td><b>${tot}</b></td></tr>`}).join('');
    h+=`<div class="card"><span class="sw" style="background:${col(s)}"></span><b>${esc(s.n)}</b>${M.staff[s.f]?`<small style="color:var(--mut)">　職長：${esc(M.staff[s.f].n)}</small>`:''}<div class="wrap" style="margin-top:8px"><table class="kt"><tr><th>月</th><th>職長</th><th>施工者</th><th>応援</th><th>合計</th></tr>${rows?rows+`<tr class="tt"><td class="ym">計</td><td>${T.f}</td><td>${T.s}</td><td>${T.o}</td><td>${T.f+T.s+T.o}</td></tr>`:'<tr><td class="ym" colspan="5">まだ配置がありません</td></tr>'}</table></div></div>`});
  return h}

function dezura(){
  const y=mo.getFullYear(),m=mo.getMonth(),last=new Date(y,m+1,0).getDate(),sl=staffL();
  let h=`<div class="nav"><button class="btn" onclick="mv(-1)">前の月</button><b>${y}年${m+1}月の出面</b><button class="btn" onclick="mv(1)">次の月</button></div>`;
  if(!sl.length)return h+'<div class="card">作業員がまだいません。「作業員」タブから追加してください。</div>';
  const days=[...Array(last)].map((_,i)=>new Date(y,m,i+1)),used=new Set();
  let rows='';
  sl.forEach(([pid,p])=>{let w=0,o=0,pd=0;const by={};
    const cells=days.map(d=>{const x=M.a[pid+'_'+fmt(d)];
      if(x&&x.v=='paid'){pd++;return '<td class="dz"><span class="z pd">有</span></td>'}
      if(x&&x.v=='off'){o++;return '<td class="dz"><span class="z off">休</span></td>'}
      const ids=x?[x.v,x.v2].filter(i=>i&&M.sites[i]):[];if(!ids.length)return '<td class="dz"></td>';
      w++;ids.forEach(i=>{by[i]=(by[i]||0)+1;used.add(i)});
      return `<td class="dz">${ids.map(i=>{const s=M.sites[i];return `<button class="z${ids.length>1?' z2':''}${M.r[i+'_'+fmt(d)]?' rp':''}" style="background:${col(s)}" onclick="rpt('${i}','${fmt(d)}')" aria-label="${esc(s.n)}の日報">${esc([...s.n][0])}</button>`}).join('')}</td>`}).join('');
    rows+=`<tr><td class="nm">${esc(p.n)}<small>${p.r=='応援'?'応援':'施工者'}</small></td><td><b>${w}</b>日</td><td><b>${pd}</b></td>${cells}</tr>`;
  });
  h+=`<div class="wrap"><table><tr><th class="nm"> </th><th style="min-width:44px">出勤</th><th style="min-width:40px">有給</th>${days.map(d=>{const red=d.getDay()==0||HOL.has(fmt(d));return `<th style="min-width:32px${red?';color:var(--bad)':''}">${d.getDate()}<br>${DW[d.getDay()]}</th>`}).join('')}</tr>${rows}</table></div>`;
  h+='<p style="font-size:12px;color:var(--mut);margin:6px 0 0">色のついたマスは出勤で、文字は現場名の頭文字です。「休」は休み、「有」は有給です。マスをタップすると、その日の日報が開きます（下に白い線があるマスは日報が入力済み）。</p>';
  h+=[...used].map(id=>`<span style="margin-right:10px;font-size:13px"><span class="sw" style="background:${col(M.sites[id])}"></span>${esc(M.sites[id].n)}</span>`).join('');
  return h}

function draw(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
  if(tab=='r'&&!RP.pv&&RP.dirty&&document.getElementById('rc'))RP.dr=readForm();const sy=window.scrollY;
  $m.innerHTML=tab=='g'?grid():tab=='m'?month():tab=='k'?kosu():tab=='d'?dezura():tab=='r'?report():tab=='s'?sites():staff();
  window.scrollTo(0,sy)}
document.querySelector('.tabs').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;draw()}};
$sh.onclick=e=>{if(e.target==$sh)$sh.classList.remove('on')};
function wk(n){ws=add(ws,n);draw()}
function mv(n){mo=new Date(mo.getFullYear(),mo.getMonth()+n,1);draw()}

function paidCount(pid,y){let n=0;for(const k in M.a){const x=M.a[k];if(x.p==pid&&x.v=='paid'&&x.d.startsWith(y))n++}return n}
let PK=null;
function pick(pid,f){
  const x=M.a[pid+'_'+f];
  PK={pid,f,sel:x&&x.v!='off'&&x.v!='paid'?[x.v,x.v2].filter(i=>i&&M.sites[i]):[]};
  renderPick();$sh.classList.add('on')}
function renderPick(){
  const {pid,f,sel}=PK,p=M.staff[pid],d=prs(f),box=document.getElementById('shc'),st=box.scrollTop;
  const ids=active(f).map(([id])=>id);sel.forEach(i=>{if(!ids.includes(i))ids.push(i)});
  box.innerHTML=`<b>${esc(p.n)}　${md(d)}（${DW[d.getDay()]}）</b><p style="font-size:12px;color:var(--mut);margin:4px 0 10px">1日に2現場まで選べます（選択中 ${sel.length}/2）。選んだら「決定」を押してください。</p>`+
   (ids.length?ids.map(sid=>{const s=M.sites[sid],k=sel.indexOf(sid);return `<button class="btn opt" style="${k>=0?`border:2px solid ${col(s)}`:''}" onclick="togSel('${sid}')"><span class="sw" style="background:${col(s)}"></span>${esc(s.n)}${k>=0?'　'+['①','②'][k]:''}</button>`}).join(''):'<p style="color:var(--mut)">この日に稼働する現場がありません。「現場」タブで期間を確認するか、下から当日のみの現場を追加してください。</p>')+
   `<button class="btn pri opt" onclick="saveSel()">${sel.length?`決定（${sel.length}現場）`:'決定（配置なし）'}</button><div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn" style="flex:1" onclick="setA('${pid}','${f}','off')">休み</button><button class="btn" style="flex:1" onclick="setA('${pid}','${f}','paid')">有給</button><button class="btn" style="flex:1" onclick="setA('${pid}','${f}','')">配置を外す</button></div>`+quickForm(pid,f);
  box.scrollTop=st}
function togSel(sid){const i=PK.sel.indexOf(sid);if(i>=0)PK.sel.splice(i,1);else if(PK.sel.length>=2){toast('1日に選べる現場は2つまでです');return}else PK.sel.push(sid);renderPick()}
function setSel(pid,f,sel){const id=pid+'_'+f;if(!sel.length)return rem('a',id);const d={p:pid,d:f,v:sel[0]};if(sel[1])d.v2=sel[1];return put('a',id,d)}
function saveSel(){$sh.classList.remove('on');setSel(PK.pid,PK.f,PK.sel)}
function chips(x,pid){const ids=x?[x.v,x.v2].filter(i=>i&&M.sites[i]):[];if(!ids.length)return '<span class="empty">＋</span>';const two=ids.length>1;
  return ids.map(i=>{const s=M.sites[i];return `<span class="chip${two?' c2':''}" style="background:${col(s)}">${s.f==pid?'★':''}${esc(s.n)}</span>`}).join('')}
function dropSite(id){return Object.entries(M.a).filter(([,x])=>x.v==id||x.v2==id).map(([k,x])=>{const rest=[x.v,x.v2].filter(i=>i&&i!=id);return rest.length?put('a',k,{p:x.p,d:x.d,v:rest[0]}):rem('a',k)})}
function quickForm(pid,f){return `<div class="card f" style="margin:10px 0"><div class="w"><label>当日のみの現場を追加（この日だけ）</label><input id="qn" placeholder="現場名"></div><div class="w"><input id="qc" placeholder="元請け会社（任意）"></div><div class="w"><button class="btn pri" style="width:100%" onclick="quickSite('${pid}','${f}')">追加してこの日に配置</button></div></div>`}
function quickSite(pid,f){const n=gv('qn').trim();if(!n){toast('現場名を入力してください');return}
  const sid=uid(),data={n,c:gv('qc').trim(),s:f,e:f,memo:'',f:'',x:[f],o:[],done:false,h:(Object.keys(M.sites).length*67+200)%360,t:Date.now()};
  $sh.classList.remove('on');
  const cur=PK&&PK.pid==pid&&PK.f==f?PK.sel:[],sel=cur.length>=2?[cur[0],sid]:[...cur,sid];put('sites',sid,data).then(ok=>{if(ok!==false)setSel(pid,f,sel)})}
function setA(pid,f,v){$sh.classList.remove('on');const id=pid+'_'+f;if(v)put('a',id,{p:pid,d:f,v});else rem('a',id)}

function dayInfo(f){
  const ix=index(),d=prs(f),list=ix[f]||[],assigned=new Set(list.map(x=>x.p));
  let h=`<b>${md(d)}（${DW[d.getDay()]}）の配置</b><div style="height:10px"></div>`;
  const ids=siteL().map(([id])=>id).filter(id=>list.some(x=>x.v==id));
  h+=ids.length?ids.map(sid=>{const s=M.sites[sid],names=list.filter(x=>x.v==sid).map(x=>{const r=roleAt(x.p,sid);return esc(x.n)+(r=='施工者'?'':'（'+r+'）')});
    return `<div class="card"><span class="sw" style="background:${col(s)}"></span><b>${esc(s.n)}</b>　${names.length}人<br>${names.join('、')}${s.memo?`<br><small style="white-space:pre-wrap;color:var(--mut)">連絡：${esc(s.memo)}</small>`:''}<br><button class="btn" style="margin-top:6px" onclick="rpt('${sid}','${f}')">日報を開く</button></div>`}).join(''):'<div class="card">この日の配置はありません。</div>';
  const off=list.filter(x=>x.v=='off').map(x=>esc(x.n)),paid=list.filter(x=>x.v=='paid').map(x=>esc(x.n)),free=staffL().filter(([id])=>!assigned.has(id)).map(([,p])=>esc(p.n));
  h+=`<div class="card">休み：${off.join('、')||'なし'}<br>有給：${paid.join('、')||'なし'}<br>未配置：${free.join('、')||'なし'}</div><button class="btn pri opt" onclick="goWeek('${f}')">この週の配置表を開く</button>`;
  document.getElementById('shc').innerHTML=h;$sh.classList.add('on')}

function goWeek(f){ws=mon(prs(f));tab='g';$sh.classList.remove('on');draw()}

function saveSite(){const d=DR;
  if(!d.n.trim()||!d.s||!d.e||d.e<d.s||(prs(d.e)-prs(d.s))/864e5>364){toast('現場名と期間を確認してください（竣工予定日は乗り込み日以降、365日以内）');return}
  const data={n:d.n.trim(),s:d.s,e:d.e,memo:d.memo.trim(),c:(d.c||'').trim(),f:d.f||'',done:!!d.done,h:d.h,t:d.t||Date.now(),x:d.x.filter(f=>f>=d.s&&f<=d.e),o:d.o.filter(f=>f>=d.s&&f<=d.e)};
  $sh.classList.remove('on');put('sites',d.id||uid(),data)}
function delSite(id){askOk('この現場を削除します。配置と日報も削除されます。',()=>Promise.all([...dropSite(id),...Object.keys(M.r).filter(k=>M.r[k].sid==id).map(k=>rem('r',k))]).then(()=>rem('sites',id)),'削除する')}
function addStaff(){const n=document.getElementById('pn').value.trim();if(!n){toast('名前を入力してください');return}
  put('staff',uid(),{n,r:document.getElementById('pr').value,t:Date.now()})}
function delStaff(id){askOk('この作業員を削除します。',()=>Promise.all(Object.keys(M.a).filter(k=>M.a[k].p==id).map(k=>rem('a',k))).then(()=>rem('staff',id)),'削除する')}
draw();
